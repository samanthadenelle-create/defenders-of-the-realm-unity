  <!-- Hood face opening void -->
  <path d="M512 215 Q448 235 442 345 Q478 380 512 384 Q546 380 582 345 Q576 235 512 215 Z" fill="#11161f"/>
  <!-- Hood left highlight -->
  <path d="M512 120 Q360 150 350 360 L408 350 Q418 200 512 175 Z" fill="#7e6549" stroke="#16202c" stroke-width="3"/>

  <!-- Frost-blue trim on hood edge -->
  <path d="M350 360 Q420 420 512 425 Q604 420 674 360" fill="none" stroke="#7cc0ff" stroke-width="8" stroke-linecap="round"/>
  <!-- Frost trim cloak hem -->
