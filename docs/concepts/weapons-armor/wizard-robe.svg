<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1024" height="1024" fill="#1c2230"/>
  <!-- warding glow behind robe -->
  <ellipse cx="512" cy="560" rx="280" ry="380" fill="#6a3fb0" opacity="0.12"/>

  <!-- hood collar -->
  <path d="M512 140 L420 230 L440 320 L584 320 L604 230 Z" fill="#3a2766" stroke="#180e30" stroke-width="6" stroke-linejoin="round"/>
  <path d="M512 160 L466 300 L558 300 Z" fill="#241543" stroke="#180e30" stroke-width="5"/>

  <!-- shoulders / outer robe -->
  <path d="M512 300 L300 420 L260 880 L360 900 L420 560 L420 900 L604 900 L604 560 L664 900 L764 880 L724 420 Z"
        fill="#4a3186" stroke="#180e30" stroke-width="7" stroke-linejoin="round"/>

  <!-- left lit panel -->
  <path d="M512 300 L300 420 L260 880 L360 900 L420 560 L460 320 Z" fill="#5e3f9e" stroke="#180e30" stroke-width="6" stroke-linejoin="round"/>

  <!-- inner front robe (front-opening) -->
  <path d="M460 320 L420 560 L420 900 L604 900 L604 560 L564 320 Z" fill="#553a93" stroke="#180e30" stroke-width="6" stroke-linejoin="round"/>
  <!-- center placket -->
  <path d="M500 320 L488 900 L536 900 L524 320 Z" fill="#6e4bb8" stroke="#180e30" stroke-width="4"/>

  <!-- ghost-white runic trim down the front -->
  <g stroke="#e8e2ff" stroke-width="5" fill="none" opacity="0.92">
    <path d="M512 350 L512 870"/>
    <path d="M500 420 l24 0 M500 500 l24 0 M500 580 l24 0 M500 660 l24 0 M500 740 l24 0"/>
  </g>
  <!-- runes -->
  <g fill="#e8e2ff" opacity="0.95">
    <circle cx="512" cy="400" r="9"/>
    <path d="M512 470 l10 18 -20 0 z"/>
    <rect x="503" y="545" width="18" height="18" transform="rotate(45 512 554)"/>
    <circle cx="512" cy="640" r="8"/>
    <path d="M502 720 l20 0 0 18 -20 0 z"/>
  </g>

  <!-- hem trim -->
  <path d="M420 870 L604 870 L604 900 L420 900 Z" fill="#2a1b4d" stroke="#180e30" stroke-width="4"/>
  <!-- sleeve trim -->
  <path d="M300 420 L724 420 L724 470 L300 470 Z" fill="#3a2766" opacity="0.5"/>
</svg>
