<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1024" height="1024" fill="#1c2230"/>
  <defs>
    <radialGradient id="aetherGlow" cx="50%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#E8E0FF" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#9B6FFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9B6FFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sigilCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E8E0FF"/>
      <stop offset="100%" stop-color="#9B6FFF"/>
    </radialGradient>
  </defs>

  <!-- ambient aether glow -->
  <ellipse cx="512" cy="300" rx="250" ry="280" fill="url(#aetherGlow)"/>

  <!-- radiant rays from sigil -->
  <g stroke="#E8E0FF" stroke-width="5" opacity="0.55">
    <line x1="512" y1="120" x2="512" y2="60"/>
    <line x1="640" y1="300" x2="700" y2="300"/>
    <line x1="384" y1="300" x2="324" y2="300"/>
    <line x1="610" y1="200" x2="660" y2="150"/>
    <line x1="414" y1="200" x2="364" y2="150"/>
    <line x1="610" y1="400" x2="660" y2="450"/>
    <line x1="414" y1="400" x2="364" y2="450"/>
  </g>

  <!-- outer ward ring -->
  <circle cx="512" cy="300" r="120" fill="none" stroke="#9B6FFF" stroke-width="8" opacity="0.85"/>
  <circle cx="512" cy="300" r="120" fill="none" stroke="#E8E0FF" stroke-width="3"/>

  <!-- ward-sigil: layered hexagram / star -->
  <path d="M512 196 L572 300 L512 404 L452 300 Z" fill="#9B6FFF" opacity="0.55"/>
  <path d="M408 250 L616 250 L512 430 Z" fill="#C8B4FF" opacity="0.45"/>
  <path d="M616 250 L408 250 L512 430 Z" transform="rotate(180 512 310)" fill="#C8B4FF" opacity="0.45"/>

  <!-- crisp star -->
  <path d="M512 210 L532 282 L604 300 L532 318 L512 390 L492 318 L420 300 L492 282 Z"
        fill="url(#sigilCore)" stroke="#7a4fd0" stroke-width="3"/>

  <!-- glowing core orb -->
  <circle cx="512" cy="300" r="34" fill="url(#sigilCore)"/>
  <circle cx="512" cy="300" r="34" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
  <circle cx="502" cy="290" r="10" fill="#FFFFFF" opacity="0.95"/>

  <!-- small orbiting motes -->
  <circle cx="600" cy="230" r="8" fill="#E8E0FF" opacity="0.9"/>
  <circle cx="430" cy="370" r="7" fill="#C8B4FF" opacity="0.85"/>
  <circle cx="590" cy="380" r="6" fill="#E8E0FF" opacity="0.8"/>

  <!-- wand shaft (short) -->
  <rect x="496" y="420" width="32" height="380" rx="12" fill="#3a3050" stroke="#1f1830" stroke-width="3"/>
  <rect x="496" y="420" width="13" height="380" fill="#5a4a78" opacity="0.7"/>
  <!-- shaft rune bands -->
  <rect x="490" y="470" width="44" height="14" rx="4" fill="#9B6FFF" opacity="0.8"/>
  <rect x="490" y="640" width="44" height="14" rx="4" fill="#9B6FFF" opacity="0.8"/>

  <!-- claw setting holding the sigil -->
  <path d="M478 420 L470 380 L500 410 Z" fill="#5a4a78" stroke="#1f1830" stroke-width="2"/>
  <path d="M546 420 L554 380 L524 410 Z" fill="#5a4a78" stroke="#1f1830" stroke-width="2"/>

  <!-- pommel orb -->
  <circle cx="512" cy="820" r="30" fill="#3a3050" stroke="#1f1830" stroke-width="3"/>
  <circle cx="512" cy="820" r="13" fill="#9B6FFF"/>
  <circle cx="506" cy="814" r="5" fill="#E8E0FF"/>
</svg>
