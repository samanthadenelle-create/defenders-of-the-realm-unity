<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Enhancements — Obsidian UI Template</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Alata&family=Acme&display=swap');
  :root{
    /* ElarionUi semantic tokens (Obsidian theme) */
    --gold:#f0b428;          /* accents & content ONLY — never chrome outline */
    --gold-bright:#ffd45e;
    --gold-dim:#a97c1a;
    --parchment:#e6e2d3;
    --parchment-dim:#9b9b93;
    --affordable:#7ddc8a;
    --danger:#e07a6a;
    --aether:#39d6b0;
    --disabled:#5a5a55;
    /* forged steel chrome */
    --steel-hi:#7d8188;
    --steel:#4a4d53;
    --steel-mid:#33363b;
    --steel-lo:#1b1d20;
    --obsidian:#0b0b0d;
    --font-title:'Merriweather',Georgia,serif;
    --font-body:'Alata','Trebuchet MS',sans-serif;
    --font-stamp:'Acme','Arial Narrow',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(ellipse at 50% 30%, #101014 0%, #050506 70%);
    font-family:var(--font-body);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;gap:14px;
  }

  /* demo-only building switcher (not part of the in-game screen) */
  .demo-switch{display:flex;align-items:center;gap:10px}
  .demo-switch .lbl{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#6f6f68}
  .demo-switch button{
    font-family:var(--font-body);font-size:14px;cursor:pointer;border-radius:4px;
    padding:5px 14px;color:var(--parchment-dim);border:1px solid #34363b;
    background:linear-gradient(180deg,#17181b,#0e0e10);
  }
  .demo-switch button.on{color:var(--gold-bright);border-color:#565960;
    background:linear-gradient(180deg,#2a2d32,#191b1e)}

  /* ============ THE OBSIDIAN FRAME (the chrome IS the frame) ============ */
  .frame{
    width:1180px;max-width:100%;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.03), transparent 55%),
      linear-gradient(180deg,#141417 0%,#0b0b0d 55%,#0e0e11 100%);
    border:2px solid #43464c;
    border-radius:12px;
    box-shadow:
      0 0 0 1px #08080a, 0 0 0 4px #26282c, 0 0 0 5px #0a0a0c,
      0 24px 70px rgba(0,0,0,.95),
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 0 110px rgba(0,0,0,.8);
    position:relative;
    padding:20px 26px 20px;
  }
  .frame::before{
    content:"";position:absolute;inset:7px;border-radius:8px;pointer-events:none;
    border:1px solid rgba(160,166,176,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.6);
  }
  .corner{
    position:absolute;width:34px;height:34px;pointer-events:none;
    background:linear-gradient(135deg,#4c4f55,#26282c 70%);
    border:1px solid #55585e;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 2px 4px rgba(0,0,0,.7);
  }
  .corner::after{
    content:"";position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#9da1a8,#4a4d53 55%,#141518);
    box-shadow:0 1px 2px rgba(0,0,0,.9);
    top:50%;left:50%;transform:translate(-50%,-50%);
  }
  .corner.tl{top:-3px;left:-3px;border-radius:12px 3px 10px 3px}
  .corner.tr{top:-3px;right:-3px;border-radius:3px 12px 3px 10px}
  .corner.bl{bottom:-3px;left:-3px;border-radius:3px 10px 3px 12px}
  .corner.br{bottom:-3px;right:-3px;border-radius:10px 3px 12px 3px}

  /* ============ HEADER PLATE + MEDALLION + CLOSE NOTCH ============ */
  .header{display:flex;align-items:center;gap:16px;margin:2px 0 14px;position:relative;height:64px}
  .medallion{
    width:64px;height:64px;flex:none;border-radius:50%;position:relative;
    background:radial-gradient(circle at 32% 28%, #3b3e44, #17181b 70%);
    border:3px solid #4c4f55;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.85), 0 2px 6px rgba(0,0,0,.7), inset 0 -1px 0 rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center;
  }
  .medallion::before{
    content:"";position:absolute;inset:-7px;border-radius:50%;pointer-events:none;
    border:1px solid rgba(160,166,176,.25);
  }
  .medallion svg{width:40px;height:40px}
  .header-plate{
    flex:1;height:54px;position:relative;
    background:linear-gradient(180deg,#26282d 0%,#17181b 55%,#1d1f23 100%);
    border:1px solid #43464c;border-radius:6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.09), inset 0 -6px 12px rgba(0,0,0,.5), 0 2px 5px rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;
  }
  .header-plate::before,.header-plate::after{
    content:"";position:absolute;top:50%;width:8px;height:8px;border-radius:50%;transform:translateY(-50%);
    background:radial-gradient(circle at 35% 30%,#9da1a8,#4a4d53 55%,#141518);
    box-shadow:0 1px 2px rgba(0,0,0,.9);
  }
  .header-plate::before{left:12px}
  .header-plate::after{right:12px}
  h1{
    font-family:var(--font-title);font-weight:900;
    font-size:29px;letter-spacing:.5px;color:var(--gold);
    text-shadow:0 2px 0 #000, 0 0 22px rgba(240,180,40,.18);
  }
  .close-notch{
    width:44px;height:44px;flex:none;border-radius:8px;cursor:pointer;
    background:linear-gradient(180deg,#33363c,#1a1c1f);
    border:1px solid #4c4f55;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 2px 5px rgba(0,0,0,.7);
    display:flex;align-items:center;justify-content:center;
  }
  .close-notch:hover{filter:brightness(1.25)}
  .close-notch:active{filter:brightness(.85)}
  .close-notch svg{width:16px;height:16px}

  /* ============ WALLET ROW (CurrencyChip / BuildWalletRow) ============ */
  .resources{display:flex;gap:10px;margin-bottom:14px}
  .res{
    flex:1;display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,#101013,#0a0a0c);
    border:1px solid #3a3d42;border-radius:6px;
    padding:6px 12px;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.75), inset 0 -1px 0 rgba(255,255,255,.04);
  }
  .res svg{width:22px;height:22px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.8))}
  .res span{margin-left:auto;font-size:19px;color:var(--parchment);text-shadow:0 1px 0 #000;letter-spacing:.5px}
  .res.gold span{color:var(--gold-bright);font-size:22px}

  /* ============ TABS (BuildTabRow — plate + underline, never hue alone) ============ */
  .tabs{display:flex;gap:12px;margin-bottom:16px}
  .tab{
    flex:1;text-align:center;padding:9px 0 11px;font-size:19px;border-radius:5px;
    border:1px solid #34363b;color:var(--parchment-dim);
    background:linear-gradient(180deg,#141416,#0d0d0f);
    cursor:pointer;letter-spacing:1px;position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  }
  .tab.active{
    color:var(--gold-bright);
    background:linear-gradient(180deg,#2a2d32 0%,#191b1e 60%,#202226 100%);
    border-color:#565960;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 2px 6px rgba(0,0,0,.6);
    text-shadow:0 1px 0 #000;
  }
  .tab.active::after{
    content:"";position:absolute;left:14%;right:14%;bottom:4px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold) 25%,var(--gold) 75%,transparent);
    box-shadow:0 0 8px rgba(240,180,40,.5);
  }

  /* ============ MAIN ============ */
  .main{display:flex;gap:16px}
  .stage{
    flex:1;
    background:linear-gradient(180deg,#0c0c0e,#08080a);
    border:1px solid #2e3034;border-radius:8px;
    padding:18px 14px 16px;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.8), inset 0 0 50px rgba(0,0,0,.6);
    position:relative;
  }
  .stage-title{
    text-align:center;color:var(--parchment-dim);font-family:var(--font-stamp);
    font-size:15px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;
  }
  .tiers{display:flex;align-items:stretch;gap:0}
  .tier{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:12px 8px 14px;border-radius:8px;position:relative;
    border:1px solid transparent;cursor:pointer;
  }
  .tier .art{width:100%;max-width:225px}
  .tier .art svg{width:100%;filter:drop-shadow(0 10px 12px rgba(0,0,0,.7))}
  .tier-label{font-family:var(--font-stamp);font-size:15px;letter-spacing:3px;color:var(--parchment-dim);text-transform:uppercase}
  .tier-name{font-family:var(--font-title);font-weight:700;font-size:18px;color:var(--parchment);text-shadow:0 1px 0 #000;text-align:center}
  .tier-bonus{font-size:14.5px;color:var(--gold);text-align:center;min-height:38px}
  /* OWNED state: green plate (Affordable alpha .22) + built chip */
  .tier.owned{
    background:linear-gradient(180deg,rgba(125,220,138,.07),rgba(125,220,138,.02));
    border:1px solid rgba(125,220,138,.35);
  }
  /* UNLOCKABLE hero state: gold plate alpha ~.2 + gold rim glow (canon) */
  .tier.selected{
    background:linear-gradient(180deg,rgba(240,180,40,.08),rgba(240,180,40,.02));
    border:1px solid rgba(240,180,40,.55);
    box-shadow:0 0 24px rgba(240,180,40,.14), inset 0 0 30px rgba(240,180,40,.05);
  }
  .tier.selected .tier-label{color:var(--gold)}
  /* previewing a locked tier: steel rim, no gold */
  .tier.preview{border:1px solid #565960;background:rgba(255,255,255,.02)}
  /* LOCKED: desaturate + dim, keep mostly in color to sell progression */
  .tier.locked .art svg{filter:grayscale(.35) brightness(.75) drop-shadow(0 10px 12px rgba(0,0,0,.7))}
  .tier.locked .tier-name{color:#8b8b84}
  .tier.locked .tier-bonus{color:#7d6c3c}

  .arrow{align-self:center;flex:none;width:34px;opacity:.7;margin:0 -6px;padding-bottom:70px}

  /* ============ OBSIDIAN BUTTONS ============ */
  .btn{
    font-family:var(--font-body);font-size:17px;letter-spacing:.5px;cursor:pointer;
    border-radius:5px;padding:9px 26px;
    color:var(--parchment);border:1px solid #4c4f55;
    background:linear-gradient(180deg,#3a3d43,#1e2023);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 2px 4px rgba(0,0,0,.6);
    text-shadow:0 1px 1px rgba(0,0,0,.7);
  }
  .btn:hover{filter:brightness(1.15)}
  .btn:active{filter:brightness(.85)}
  .btn.gold{
    color:#221803;font-weight:700;border:1px solid #6b5410;
    background:linear-gradient(180deg,var(--gold-bright) 0%,#d9a422 45%,#b8860f 100%);
    text-shadow:0 1px 0 rgba(255,255,255,.35);
    box-shadow:0 0 16px rgba(240,180,40,.3), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 4px rgba(90,60,0,.45);
  }
  .btn.disabled{
    cursor:not-allowed;color:#77756c;
    background:linear-gradient(180deg,#26282c,#17181b);
    border:1px solid #34363b;box-shadow:none;filter:none;
  }
  .lock-chip{
    display:flex;align-items:center;gap:7px;
    font-size:13px;color:#98958a;text-align:center;
    background:linear-gradient(180deg,#17181b,#101113);
    border:1px solid #34363b;border-radius:4px;
    padding:7px 12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
  .lock-chip svg{width:14px;height:14px;flex:none}
  .built-chip{
    display:flex;align-items:center;gap:7px;font-size:13px;color:var(--affordable);
    background:linear-gradient(180deg,#12211a,#0c1712);
    border:1px solid #2c4a36;border-radius:4px;padding:7px 12px;
  }
  .built-chip svg{width:14px;height:14px;flex:none}

  /* ============ SIDE PANEL ============ */
  .side{
    width:296px;flex:none;
    background:linear-gradient(180deg,#101013,#0a0a0c);
    border:1px solid #34363b;border-radius:8px;
    padding:16px;display:flex;flex-direction:column;gap:12px;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.75);
  }
  .side h2{font-family:var(--font-title);font-weight:700;font-size:20px;color:var(--gold);text-align:center;text-shadow:0 1px 0 #000}
  .side .sub{font-family:var(--font-stamp);font-size:12.5px;color:var(--parchment-dim);text-align:center;margin-top:-8px;letter-spacing:2px;text-transform:uppercase}
  .divider{height:2px;position:relative;
    background:linear-gradient(90deg,transparent,#3d3f44,transparent);
  }
  .divider::after{content:"";position:absolute;left:0;right:0;top:1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
  .benefits{display:flex;flex-direction:column;gap:7px}
  .benefits .b{display:flex;gap:8px;font-size:14px;color:#cfcdc2;line-height:1.35}
  .benefits .b svg{width:15px;height:15px;flex:none;margin-top:2px}
  .benefits .b.future{color:#6f6f68}
  .cost-title{font-family:var(--font-stamp);font-size:12.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--parchment-dim);text-align:center}
  .costs{display:flex;gap:8px}
  .cost{
    flex:1;display:flex;align-items:center;gap:7px;justify-content:center;
    background:linear-gradient(180deg,#131316,#0b0b0d);
    border:1px solid #3a3d42;border-radius:5px;padding:7px 8px;
    font-size:18px;color:var(--parchment);text-shadow:0 1px 0 #000;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7), inset 0 -1px 0 rgba(255,255,255,.04);
  }
  .cost svg{width:20px;height:20px}
  .cost .ok{color:var(--affordable)}
  .cost .short{color:var(--danger)}
  .afford-note{font-size:11.5px;text-align:center;margin-top:-6px;letter-spacing:.5px;color:var(--affordable)}
  .afford-note.short{color:var(--danger)}
  .side .btn{width:100%;padding:12px 0;font-size:19px}
  .keyline{font-family:var(--font-stamp);font-size:11.5px;letter-spacing:2px;
    text-transform:uppercase;color:var(--parchment-dim);text-align:center}

  /* ============ FOOTER STRIP ============ */
  .footer{
    display:flex;justify-content:center;margin-top:18px;padding-top:14px;position:relative;
  }
  .footer::before{
    content:"";position:absolute;top:0;left:6%;right:6%;height:2px;
    background:linear-gradient(90deg,transparent,#3d3f44,transparent);
  }
  .btn.close{
    font-size:20px;padding:10px 64px;color:var(--parchment);
    background:linear-gradient(180deg,#3a3d43,#1b1d20);
    border:1px solid #55585e;
  }
</style>
</head>
<body>

<!-- DEMO ONLY: proves the template is generic — same screen, different building JSON -->
<div class="demo-switch">
  <span class="lbl">Template Demo &mdash; building JSON:</span>
  <button id="sw-lumbermill" class="on" onclick="render('lumbermill')">Lumbermill</button>
  <button id="sw-windmill" onclick="render('windmill')">Windmill</button>
  <button id="sw-forge" onclick="render('forge')">Forge</button>
  <button id="sw-armorer" onclick="render('armorer')">Armorer</button>
  <button id="sw-arcane-tower" onclick="render('arcane-tower')">Arcane Tower</button>
</div>

<div class="frame">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

  <div class="header">
    <div class="medallion" id="medallion"></div>
    <div class="header-plate"><h1 id="title"></h1></div>
    <div class="close-notch" title="Close">
      <svg viewBox="0 0 16 16"><path d="M3 3 L13 13 M13 3 L3 13" stroke="#c9c6b8" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div class="resources" id="wallet"></div>
  <div class="tabs" id="tabs"></div>

  <div class="main">
    <div class="stage">
      <div class="stage-title">Enhancement Path</div>
      <div class="tiers" id="tiers"></div>
    </div>
    <div class="side" id="side"></div>
  </div>

  <div class="footer"><button class="btn close">Close</button></div>
</div>

<script>
/* =====================================================================
   GENERIC UPGRADE PANEL — one template, any building.
   In-engine mapping: BuildingUpgradePanelMvvm builds the chrome once via
   ElarionUiKit.BuildObsidianPanel(frameName), then binds a BuildingUpgradeVM
   hydrated from building-tiers.json. This mockup mirrors that contract:
   render(configId) is the "VM bind"; CONFIGS[x] is the building's JSON row.
   ===================================================================== */

/* ---------- shared resource icon set (CurrencyChip icons stay ours) ---------- */
const ICONS = {
  gold:`<svg viewBox="0 0 24 24"><circle cx="9" cy="14" r="6" fill="#f0b428" stroke="#8a5f0c"/><circle cx="14" cy="11" r="6" fill="#ffd45e" stroke="#8a5f0c"/><circle cx="14" cy="11" r="3.2" fill="none" stroke="#c8901c"/></svg>`,
  wood:`<svg viewBox="0 0 24 24"><rect x="3" y="8" width="16" height="4" rx="2" fill="#9a6a35" stroke="#5d3c15"/><rect x="5" y="13" width="16" height="4" rx="2" fill="#b07c40" stroke="#5d3c15"/><circle cx="19" cy="10" r="1.4" fill="#e0b884"/><circle cx="21" cy="15" r="1.4" fill="#e0b884"/></svg>`,
  sap:`<svg viewBox="0 0 24 24"><path d="M12 3 C12 3 8 9 8 13 a4.5 4.5 0 0 0 9 0 C17 9 12 3 12 3 Z" fill="#3fae4e" stroke="#1c5f26"/><path d="M12 6 C12 6 10 10 10 13 a2.5 2.5 0 0 0 3 2.4" fill="#7fdc8a" opacity=".7"/></svg>`,
  crystal:`<svg viewBox="0 0 24 24"><path d="M12 2 L17 8 L14.5 21 H9.5 L7 8 Z" fill="#4db8f0" stroke="#1c5f8a"/><path d="M12 2 L14 8 L12 20 Z" fill="#a8e2ff" opacity=".8"/></svg>`,
  food:`<svg viewBox="0 0 24 24"><path d="M12 21 V8" stroke="#c9a84c" stroke-width="2"/><g fill="#e0c46a" stroke="#8a6d20"><ellipse cx="12" cy="5.6" rx="2.2" ry="3.4"/><ellipse cx="8.6" cy="9" rx="2" ry="3" transform="rotate(-30 8.6 9)"/><ellipse cx="15.4" cy="9" rx="2" ry="3" transform="rotate(30 15.4 9)"/><ellipse cx="7.6" cy="13" rx="2" ry="3" transform="rotate(-35 7.6 13)"/><ellipse cx="16.4" cy="13" rx="2" ry="3" transform="rotate(35 16.4 13)"/></g></svg>`,
  iron:`<svg viewBox="0 0 24 24"><path d="M4 15 h7 l1.5 4 H2.5 Z" fill="#9ea1a7" stroke="#54565a"/><path d="M13 15 h7 l1.5 4 H11.5 Z" fill="#b9bdc4" stroke="#54565a"/><path d="M8.5 9 h7 l1.5 4 H7 Z" fill="#c9ccd2" stroke="#54565a"/></svg>`,
  aether:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="#124a3c" stroke="#39d6b0" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#5ff0cc"/></svg>`
};
const check = `<svg viewBox="0 0 15 15"><path d="M2 8 l4 4 L13 3" stroke="#7ddc8a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const lock  = c=>`<svg viewBox="0 0 15 15"><rect x="2.5" y="6.5" width="10" height="7" rx="1.5" fill="${c}"/><path d="M4.5 6.5 V5 a3 3 0 0 1 6 0 v1.5" stroke="${c}" stroke-width="1.8" fill="none"/></svg>`;

/* ---------- CompactNumber (no ellipsis, ever) ---------- */
function compact(n){
  if(n>=1000000) return (n/1000000).toFixed(n%1000000?1:0).replace(/\.0$/,"")+"m";
  if(n>=1000)    return (n/1000).toFixed(n%1000?1:0).replace(/\.0$/,"")+"k";
  return String(n);
}

let current=null, selectedIdx=0;

function render(id){
  current=CONFIGS[id];
  document.querySelectorAll(".demo-switch button").forEach(b=>b.classList.remove("on"));
  document.getElementById("sw-"+id).classList.add("on");
  /* default selection = first unlockable tier, else first tier */
  selectedIdx=Math.max(0,current.tiers.findIndex(t=>t.state==="unlockable"));
  document.getElementById("medallion").innerHTML=EMBLEMS[id]||"";
  document.getElementById("title").textContent=current.title;
  document.getElementById("wallet").innerHTML=current.wallet.map(w=>
    `<div class="res ${w.primary?"gold":""}">${ICONS[w.resource]||""}<span>${compact(w.amount)}</span></div>`).join("");
  document.getElementById("tabs").innerHTML=current.tabs.map((t,i)=>
    `<div class="tab ${i===0?"active":""}">${t}</div>`).join("");
  renderTiers();
}

function renderTiers(){
  const goldArrow=`<svg class="arrow" viewBox="0 0 34 24"><path d="M2 12 H24 M18 4 L26 12 L18 20" stroke="#f0b428" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const steelArrow=goldArrow.replace('#f0b428','#5a5c60');
  let html="";
  current.tiers.forEach((t,i)=>{
    const isSel=i===selectedIdx;
    const cls=[ "tier",
      t.state==="owned"?"owned":"",
      t.state==="locked"?"locked":"",
      isSel ? (t.state==="locked"?"preview":"selected") : ""
    ].join(" ");
    let action="";
    if(t.state==="unlockable") action=`<button class="btn gold">Upgrade</button>`;
    else if(t.state==="owned") action=`<div class="built-chip">${check} Built</div>`;
    else action=`<div class="lock-chip">${lock("#7a7a72")} Requires ${t.requires?("Tier "+t.requires.tier.slice(1)+": "+t.requires.name):"previous tier"}</div>`;
    html+=`<div class="${cls}" onclick="select(${i})">
      <div class="tier-label">Tier ${i+1}</div>
      <div class="art">${ART[t.art]||""}</div>
      <div class="tier-name">${t.name}</div>
      <div class="tier-bonus">${t.bonus}</div>
      ${action}
    </div>`;
    if(i<current.tiers.length-1){
      /* gold arrow only up to the next unlockable step; steel beyond */
      const nextUnlock=current.tiers[i+1].state!=="locked"||current.tiers[i].state==="unlockable";
      html+= nextUnlock?goldArrow:steelArrow;
    }
  });
  document.getElementById("tiers").innerHTML=html;
  renderSide();
}

function select(i){ selectedIdx=i; renderTiers(); }

function renderSide(){
  const t=current.tiers[selectedIdx];
  const stateLabel = t.state==="owned"?"Built":(t.state==="unlockable"?"Selected":"Locked");
  const costs=t.cost.map(c=>
    `<div class="cost">${ICONS[c.resource]||""}<span class="ok">${compact(c.amount)}</span></div>`).join("");
  let cta, note;
  if(t.state==="unlockable"){
    cta=`<button class="btn gold">Upgrade</button>`;
    note=`<div class="afford-note">Affordable &mdash; you have enough resources</div>`;
  } else if(t.state==="owned"){
    cta=`<button class="btn disabled">Built</button>`; note="";
  } else {
    cta=`<button class="btn disabled">Requires Tier ${t.requires?t.requires.tier.slice(1):"?"}: ${t.requires?t.requires.name:""}</button>`;
    note="";
  }
  document.getElementById("side").innerHTML=`
    <h2>${t.name}</h2>
    <div class="sub">Tier ${selectedIdx+1} &mdash; ${stateLabel}</div>
    <div class="divider"></div>
    <div class="benefits">${t.benefits.map(b=>
      `<div class="b ${b.earned?"":"future"}">${b.earned?check:lock("#6f6f68")}${b.text}</div>`).join("")}
    </div>
    <div class="divider"></div>
    <div class="cost-title">Upgrade Cost</div>
    <div class="costs">${costs}</div>
    ${note}${cta}
    <div class="keyline">UPGRADES ${current.buildingId.replace("-"," ").toUpperCase()} TO TIER ${selectedIdx+1}</div>`;
}

render("lumbermill");
