<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Elarion — Live Ops</title>
<!--
  =============================================================================
  site/admin.html — the OWNER-ONLY live-ops dashboard (2026-08-17, WO-1116)
  -----------------------------------------------------------------------------
  Read-only view over api/admin/stats.js. UNLISTED: nothing links here from
  index.html, and it is noindex. The only gate is the admin key.

  ⛔ THE KEY IS NEVER STORED. It lives in one JS variable for the life of the
     tab and is gone on reload. It is NOT written to localStorage,
     sessionStorage, a cookie, or the URL — this directory is a PUBLIC Vercel
     deployment, so anything persisted here is on the internet. Never hardcode
     a key in this file for convenience "just while testing"; the file is
     deployed the moment it is committed.

  No build step, no framework, no CDN, no webfonts, no remote images — the site
  project ships a strict static bundle and everything below is inline.

  ⚠ COLOUR IS NEVER THE SIGNAL. The owner is red/green colourblind, so no metric
    is encoded in hue: direction is a word plus an arrow glyph (▲ up / ▼ down /
    ● flat), quality is a text chip ("low n", "not mature yet", "no data yet"),
    and magnitude is bar LENGTH in one single accent colour.
  =============================================================================
-->
<style>
  :root{
    --ink:#07060a; --panel:#12111a; --panel2:#191823; --line:#2b2937;
    --text:#ece8f5; --dim:#9a94ad; --accent:#e8b84b; --accent2:#7dffc8;
    --bar:#4a4560;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ink); color:var(--text); font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  a{color:var(--accent2)}
  .wrap{max-width:1100px;margin:0 auto;padding:14px}
  header.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);padding:10px 14px;position:sticky;top:0;background:var(--ink);z-index:5}
  .brand{font-weight:700;letter-spacing:.03em}
  .brand small{color:var(--dim);font-weight:400;letter-spacing:0}
  button,select,input{font:inherit}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;min-height:44px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
  button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
  input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;min-height:44px;width:100%}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .card h2{margin:0 0 4px;font-size:16px;letter-spacing:.02em}
  .card p.note{margin:4px 0 0;color:var(--dim);font-size:13px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
  .tile .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .tile .v{font-size:28px;font-weight:700;line-height:1.15;margin-top:2px}
  .tile .s{color:var(--dim);font-size:12px;margin-top:2px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--panel2)}
  .chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;
    font-size:11px;color:var(--dim);margin-left:6px;white-space:nowrap}
  .chip.warn{border-color:var(--accent);color:var(--accent)}
  .chip.warn::before{content:"! ";font-weight:700}
  .bar{position:relative;background:var(--bar);height:8px;border-radius:4px;min-width:60px}
  .bar > i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px;display:block}
  td.wrapcell,th.wrapcell{white-space:normal;max-width:560px;min-width:240px}
  pre.tail{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;padding:8px;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    font-size:12px;line-height:1.45;max-height:220px;overflow:auto}
  .none{color:var(--dim);font-style:italic}
  .err{border-color:var(--accent);color:var(--accent)}
  .gate{max-width:460px;margin:8vh auto;padding:0 14px}
  .gate label{display:block;margin:14px 0 6px;color:var(--dim);font-size:13px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grow{flex:1 1 200px}
  .muted{color:var(--dim)}
  .arrow{font-weight:700}
  code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
  @media (max-width:520px){ .wrap{padding:10px} .tile .v{font-size:24px} }
</style>
</head>
<body>

<!-- ── key gate ─────────────────────────────────────────────────────────── -->
<section id="gate" class="gate">
  <div class="card">
    <h2>Elarion — Live Ops</h2>
    <p class="note">Read-only dashboard. The key is held in memory for this tab only and is
      never saved anywhere — reloading asks again, by design.</p>
    <label for="base">API host</label>
    <input id="base" type="url" autocomplete="off" spellcheck="false"
           value="https://defenders-of-the-realm-v2.vercel.app">
    <label for="key">Admin key</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="ADMIN_DASH_KEY">
    <div class="row" style="margin-top:14px">
      <button class="primary grow" id="enter">Open dashboard</button>
    </div>
    <p class="note" id="gateMsg"></p>
  </div>
</section>

<!-- ── dashboard ────────────────────────────────────────────────────────── -->
<div id="app" hidden>
  <header class="bar">
    <div class="brand">Elarion <small>live ops</small></div>
    <div class="row">
      <select id="days" aria-label="Time window" style="width:auto">
        <option value="7">last 7 days</option>
        <option value="30" selected>last 30 days</option>
        <option value="90">last 90 days</option>
        <option value="180">last 180 days</option>
      </select>
      <button id="refresh">Refresh</button>
      <button id="lock">Lock</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <main class="wrap" id="out" aria-live="polite"></main>
</div>

<script>
(function(){
'use strict';

// ── state ──────────────────────────────────────────────────────────────────
// adminKey is deliberately a closure variable. Do not persist it. Do not put
// it in a query string (it would land in Vercel access logs and browser history).
var adminKey = null;
var apiBase  = '';
var view     = 'overview';
var days     = 30;

var VIEWS = [
  ['overview',  'Overview'],
  ['retention', 'Retention'],
  ['funnel',    'Tutorial funnel'],
  ['purchases', 'Money (settled)'],
  ['economy',   'Economy (client)'],
  ['players',   'Players'],
  ['bugreports','Player reports']
];

// ── helpers ────────────────────────────────────────────────────────────────
function el(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function n(v){ return (v == null || v === '') ? 0 : Number(v); }
function fmt(v){
  if (v == null || v === '') return '<span class="none">no data yet</span>';
  var x = Number(v);
  return Number.isFinite(x) ? x.toLocaleString() : esc(v);
}
// A percentage is NEVER rendered bare. null → "no data yet"; a small sample
// carries a "low n" chip; an immature cohort says so instead of showing 0%.
function pctCell(p, size, lowN, mature, matureLabel){
  if (mature === false) return '<span class="none">too early</span> <span class="chip">' + esc(matureLabel || 'not old enough') + '</span>';
  if (p == null) return '<span class="none">no data yet</span>';
  var s = '<strong>' + p + '%</strong>';
  if (size != null) s += ' <span class="chip">of ' + fmt(size) + '</span>';
  if (lowN) s += ' <span class="chip warn">low n</span>';
  return s;
}
function bar(value, max){
  var w = (max > 0) ? Math.round((n(value) / max) * 100) : 0;
  return '<span class="bar" role="img" aria-label="' + n(value) + '"><i style="width:' + w + '%"></i></span>';
}
function when(ts){
  if (!ts) return '<span class="none">never</span>';
  var d = new Date(ts);
  if (isNaN(d)) return esc(ts);
  return esc(d.toISOString().slice(0,16).replace('T',' ')) + ' UTC';
}
// Direction is a WORD plus a glyph — never a colour (see the header note).
function trend(curr, prev){
  var a = n(curr), b = n(prev);
  if (b === 0 && a === 0) return '<span class="muted">flat ●</span>';
  if (b === 0) return '<span class="arrow">up ▲</span>';
  var d = Math.round(((a - b) / b) * 100);
  if (d > 2)  return '<span class="arrow">up ▲ ' + d + '%</span>';
  if (d < -2) return '<span class="arrow">down ▼ ' + Math.abs(d) + '%</span>';
  return '<span class="muted">flat ● ' + d + '%</span>';
}
function table(cols, rows){
  if (!rows || !rows.length) return '<p class="none">No rows in this window.</p>';
  var h = '<div class="scroll"><table><thead><tr>';
  cols.forEach(function(c){
    var cls = (c.num ? 'num' : '') + (c.cell ? (c.num ? ' ' : '') + c.cell : '');
    h += '<th' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(c.label) + '</th>';
  });
  h += '</tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr' + (r.__ref ? ' class="click" data-ref="' + esc(r.__ref) + '"' : '') + '>';
    cols.forEach(function(c){
      var cls = (c.num ? 'num' : '') + (c.cell ? (c.num ? ' ' : '') + c.cell : '');
      h += '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + c.get(r) + '</td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}
function card(title, body, note){
  return '<section class="card"><h2>' + esc(title) + '</h2>'
       + (note ? '<p class="note">' + esc(note) + '</p>' : '') + body + '</section>';
}

// ── fetch ──────────────────────────────────────────────────────────────────
// The key travels in the X-Admin-Key HEADER, never the URL.
function api(params){ return apiGet('/api/admin/stats', params); }
// Same key, same header, either admin endpoint. The Money view needs BOTH
// (/api/admin/stats for the aggregates, /api/admin/db for the server-computed
// unfulfilled_minutes) — see renderPurchases.
function apiGet(path, params){
  var url = apiBase.replace(/\/+$/,'') + path + '?' + params;
  return fetch(url, { method:'GET', headers:{ 'X-Admin-Key': adminKey } })
    .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, body:j }; }); })
    .then(function(res){
      // The API answers 400 for both "bad key" and "bad view" (project rule:
      // 200 | 400 | 500 only), so surface its own error text rather than guess.
      if (res.body && res.body.error) throw new Error(res.body.error);
      return res.body;
    });
}

// ── renderers ──────────────────────────────────────────────────────────────
function renderOverview(d){
  var a = d.active || {}, t = d.totals || {}, an = d.anonymous || {};
  var perDay = d.per_day || [];
  var yesterday = perDay[1] || {};
  var h = '<div class="tiles">'
    + tile('Active today',   fmt(a.today), fmt(a.sessions_today) + ' app opens &middot; ' + trend(a.today, yesterday.active_players))
    + tile('Active 7 days',  fmt(a.d7),    fmt(a.sessions_7d) + ' app opens')
    + tile('Active 30 days', fmt(a.d30),   fmt(a.sessions_30d) + ' app opens')
    + tile('Events stored',  fmt(t.total_events), 'since ' + when(t.first_event_at))
    + '</div>';

  h = card('Who is playing', h,
      'Active = distinct players who fired session_start (an app open). These three tiles are FIXED 1/7/30-day windows -- the selector above changes the tables below, not these. '
    + 'Wallet-less players all share the single id "anonymous" and are excluded here.');

  h += card('The blind spot',
      '<div class="tiles">'
      + tile('Anonymous app opens', fmt(an.sessions), 'cannot be split into people')
      + tile('Anonymous events',    fmt(an.events),   'excluded from every player count')
      + '</div>',
      an.note || '');

  var maxNew = 0; (d.new_players_per_day||[]).forEach(function(r){ maxNew = Math.max(maxNew, n(r.new_players)); });
  h += card('New players per day',
    table([
      { label:'Day',  get:function(r){ return esc(r.day); } },
      { label:'New',  num:true, get:function(r){ return fmt(r.new_players); } },
      { label:'',     get:function(r){ return bar(r.new_players, maxNew); } }
    ], d.new_players_per_day),
    'A player counts as new on the day of their FIRST-EVER event, so an old player never re-counts.');

  var maxAct = 0; perDay.forEach(function(r){ maxAct = Math.max(maxAct, n(r.active_players)); });
  h += card('Daily activity',
    table([
      { label:'Day',       get:function(r){ return esc(r.day); } },
      { label:'Players',   num:true, get:function(r){ return fmt(r.active_players); } },
      { label:'App opens', num:true, get:function(r){ return fmt(r.sessions); } },
      { label:'Events',    num:true, get:function(r){ return fmt(r.events); } },
      { label:'',          get:function(r){ return bar(r.active_players, maxAct); } }
    ], perDay));

  h += card('What the game is emitting',
    table([
      { label:'Event',   get:function(r){ return '<code>' + esc(r.event_name) + '</code>'; } },
      { label:'Count',   num:true, get:function(r){ return fmt(r.events); } },
      { label:'Ids',     num:true, get:function(r){ return fmt(r.ids); } },
      { label:'Last seen', get:function(r){ return when(r.latest); } }
    ], d.events_by_name),
    'Sanity check: a metric reading zero because nobody did it looks the same as one whose event never fires. This tells them apart.');
  return h;
}
function tile(k, v, s){
  return '<div class="tile"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div>'
       + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
}

function renderRetention(d){
  var r = d.rollup || {};
  var h = '<div class="tiles">'
    + tile('Day 1', r.d1 && r.d1.pct != null ? r.d1.pct + '%' : '<span class="none">no data yet</span>',
        r.d1 ? (fmt(r.d1.returned) + ' of ' + fmt(r.d1.cohort_size) + ' players' + (r.d1.low_n ? ' &middot; low n' : '')) : '')
    + tile('Day 7', r.d7 && r.d7.pct != null ? r.d7.pct + '%' : '<span class="none">no data yet</span>',
        r.d7 ? (fmt(r.d7.returned) + ' of ' + fmt(r.d7.cohort_size) + ' players' + (r.d7.low_n ? ' &middot; low n' : '')) : '')
    + tile('Day 30', r.d30 && r.d30.pct != null ? r.d30.pct + '%' : '<span class="none">no data yet</span>',
        r.d30 ? (fmt(r.d30.returned) + ' of ' + fmt(r.d30.cohort_size) + ' players' + (r.d30.low_n ? ' &middot; low n' : '')) : '')
    + '</div>';

  h = card('Retention (pooled, mature cohorts only)', h,
      (d.definition || '') + ' Cohorts too young to have reached day N are left out entirely rather than counted as 0%.');

  h += card('By signup day',
    table([
      { label:'Signed up', get:function(x){ return esc(x.cohort_day) + (x.low_n ? ' <span class="chip warn">n=' + x.cohort_size + '</span>' : ''); } },
      { label:'Cohort', num:true, get:function(x){ return fmt(x.cohort_size); } },
      { label:'Day 1',  get:function(x){ return pctCell(x.d1_pct,  x.cohort_size, x.low_n, x.d1_mature,  'needs 1 day'); } },
      { label:'Day 7',  get:function(x){ return pctCell(x.d7_pct,  x.cohort_size, x.low_n, x.d7_mature,  'needs 7 days'); } },
      { label:'Day 30', get:function(x){ return pctCell(x.d30_pct, x.cohort_size, x.low_n, x.d30_mature, 'needs 30 days'); } }
    ], d.cohorts),
    'Every percentage carries the cohort size it came from. Anything under n=' + n(d.low_n_threshold)
    + ' is flagged "low n" — 1 of 2 is not 50% retention, it is two players.');
  return h;
}

function renderFunnel(d){
  var f = d.flow || {};
  var h = '<div class="tiles">'
    + tile('Started tutorial',  fmt(f.started_players),   'distinct players')
    + tile('Finished it',       fmt(f.completed_players), f.completion_pct != null ? f.completion_pct + '% of starters' + (f.low_n ? ' (low n)' : '') : 'no data yet')
    + tile('Skipped all of it', fmt(f.skipped_all_players), f.skip_all_pct != null ? f.skip_all_pct + '% of starters' : 'no data yet')
    + '</div>';
  h = card('Tutorial, end to end', h);

  var maxEnter = 0; (d.steps||[]).forEach(function(s){ maxEnter = Math.max(maxEnter, n(s.entered_players)); });
  h += card('Step by step',
    table([
      { label:'#',    num:true, get:function(s){ return s.order == null ? '<span class="none">?</span>' : s.order; } },
      { label:'Step', get:function(s){ return '<code>' + esc(s.step_id) + '</code>' + (s.low_n ? ' <span class="chip warn">low n</span>' : ''); } },
      { label:'Entered', num:true, get:function(s){ return fmt(s.entered_players); } },
      { label:'',     get:function(s){ return bar(s.entered_players, maxEnter); } },
      { label:'Completed', num:true, get:function(s){ return fmt(s.completed_players) + (s.completion_pct != null ? ' <span class="chip">' + s.completion_pct + '%</span>' : ''); } },
      { label:'Skipped', num:true, get:function(s){ return fmt(s.skipped_players); } },
      { label:'STUCK (auto-advanced)', num:true, get:function(s){
          if (!n(s.dropped_players)) return '<span class="muted">0</span>';
          return '<strong>' + fmt(s.dropped_players) + '</strong>'
               + (s.drop_pct != null ? ' <span class="chip warn">' + s.drop_pct + '% stuck</span>' : '')
               + (s.max_seconds_idle_sample != null ? ' <span class="chip">idle up to ' + Math.round(s.max_seconds_idle_sample) + 's</span>' : '');
        } },
      { label:'Lost before next step', num:true, get:function(s){
          if (s.lost_to_next == null) return '<span class="muted">last step</span>';
          if (!n(s.lost_to_next)) return '<span class="muted">none</span>';
          return '<strong>▼ ' + fmt(s.lost_to_next) + '</strong>'
               + (s.lost_to_next_pct != null ? ' <span class="chip">' + s.lost_to_next_pct + '%</span>' : '');
        } }
    ], d.steps),
    d.note || '');

  h += card('Contextual hints seen',
    table([
      { label:'Hint',    get:function(s){ return '<code>' + esc(s.step_id) + '</code>'; } },
      { label:'Players', num:true, get:function(s){ return fmt(s.players); } },
      { label:'Shown',   num:true, get:function(s){ return fmt(s.events); } }
    ], d.contextual_hints));
  return h;
}

function renderEconomy(d){
  var ref = d.referrals || {};
  var h = card('Purchases',
    table([
      { label:'Pack',      get:function(r){ return esc(r.pack_name || r.pack_id || '(unknown)'); } },
      { label:'Currency',  get:function(r){ return esc(r.currency || '—'); } },
      { label:'Purchases', num:true, get:function(r){ return fmt(r.purchases); } },
      { label:'Buyers',    num:true, get:function(r){ return fmt(r.buyers); } },
      { label:'Amount sent by client', get:function(r){
          var v = r.price_sample != null ? r.price_sample : r.amount_sample;
          return v == null ? '<span class="none">none sent</span>' : esc(v);
        } },
      { label:'Last', get:function(r){ return when(r.latest); } }
    ], d.purchases),
    d.revenue_note || '');

  h += card('Store views → buys',
    table([
      { label:'Pack',    get:function(r){ return esc(r.pack_name || r.pack_id); } },
      { label:'Viewers', num:true, get:function(r){ return fmt(r.viewers); } },
      { label:'Buyers',  num:true, get:function(r){ return fmt(r.buyers); } },
      { label:'Converted', get:function(r){ return pctCell(r.conversion_pct, r.viewers, r.low_n, true); } }
    ], d.conversion),
    'Distinct players who opened the pack card, against distinct players who completed a purchase of it.');

  h += card('Promo codes',
    table([
      { label:'Code',   get:function(r){ return '<code>' + esc(r.code) + '</code>'
          + (r.is_bound ? ' <span class="chip">bound to one wallet</span>' : '')
          + (r.active ? '' : ' <span class="chip warn">disabled</span>'); } },
      { label:'Redeemed', num:true, get:function(r){ return fmt(r.redemptions)
          + (r.max_redemptions != null ? ' <span class="chip">cap ' + fmt(r.max_redemptions) + '</span>' : ''); } },
      { label:'Crystals', num:true, get:function(r){ return fmt(r.crystals_granted); } },
      { label:'Coins',    num:true, get:function(r){ return fmt(r.coins_granted); } },
      { label:'Expires',  get:function(r){ return r.expires_at ? when(r.expires_at) : '<span class="muted">never</span>'; } },
      { label:'Last used', get:function(r){ return when(r.latest_redemption); } }
    ], d.promo_codes),
    'Straight from promo_codes + promo_redemptions — the ledger, not the client. A bound code shows only THAT it is bound; the wallet it belongs to is not displayed.');

  h += card('Referrals',
    '<div class="tiles">'
    + tile('Codes minted', fmt(ref.codes_minted), '')
    + tile('Claims',       fmt(ref.claims), fmt(ref.referrers_with_a_claim) + ' referrers earned one')
    + tile('Crystals paid out', fmt(ref.claim_crystals_granted), 'to claimers')
    + '</div>');

  h += card('Client-side events for the same rails',
    table([
      { label:'Event',   get:function(r){ return '<code>' + esc(r.event_name) + '</code>'; } },
      { label:'Events',  num:true, get:function(r){ return fmt(r.events); } },
      { label:'Players', num:true, get:function(r){ return fmt(r.players); } },
      { label:'Last',    get:function(r){ return when(r.latest); } }
    ], d.client_events),
    'If the client fired an event but the table above has no matching row, the write never landed. That gap is a finding, not a rounding error.');
  return h;
}

// ── Money (SERVER TRUTH) ───────────────────────────────────────────────────
// TWO endpoints back this single screen, deliberately:
//   /api/admin/stats?view=purchases  — settled totals, per-SKU, the quote→settle
//     funnel, and the client-vs-server disagreement probes. Wallets MASKED.
//   /api/admin/db?view=purchases&state=unfulfilled — the same outstanding rows,
//     but carrying `unfulfilled_minutes`, which the SERVER computes. That column
//     is the whole point: "verified 3 minutes ago" is a purchase in flight,
//     "verified 3 DAYS ago" is a player owed goods. Same status, opposite urgency.
// ⚠ Only the MINUTES are lifted from db.js, keyed by entitlement_id. Its rows
//   carry a RAW wallet; the row that actually gets rendered is the masked one
//   from stats.js, so nothing on this page un-masks an address. tx_signature is
//   shown whole because it already is a public chain record and it is the exact
//   string needed to check settlement — it is NOT linked anywhere.
// ⛔ NO WRITE PATH LIVES HERE. No re-grant button, no refund button. Minting an
//   entitlement needs its own auth and its own audit row; a button on a
//   read-only viewer is exactly how that gets skipped.
function usd(v){
  if (v == null) return '<span class="none">none</span>';
  var x = Number(v);
  return Number.isFinite(x) ? '$' + x.toFixed(2) : esc(v);
}
// Age in words. Magnitude is the WORD, never a colour (see the header note).
function age(mins){
  var m = Number(mins);
  if (!Number.isFinite(m)) return '<span class="none">unknown</span>';
  m = Math.max(0, Math.round(m));
  if (m < 60) return m + ' min';
  if (m < 1440) return Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
  var dd = Math.floor(m / 1440);
  return dd + (dd === 1 ? ' day ' : ' days ') + Math.floor((m % 1440) / 60) + ' h';
}
function renderPurchases(d, side){
  side = side || {};
  var sideErr = side.__error || null;
  var probeErrs = d.errors || [];
  var unfulfilledProbeFailed = probeErrs.some(function(e){ return e.probe === 'entitlements_unfulfilled'; });

  // server-computed minutes, keyed by entitlement_id
  var minutesById = {};
  (side.rows || []).forEach(function(r){
    if (r && r.entitlement_id != null) minutesById[String(r.entitlement_id)] = r.unfulfilled_minutes;
  });

  var na = d.needs_attention || {};
  var rows = (na.rows || []).map(function(r){
    var m = minutesById[String(r.entitlement_id)];
    if (m != null && Number.isFinite(Number(m))) { r.__mins = Number(m); r.__minsFromServer = true; }
    else {
      // Fallback ONLY if db.js did not answer. Labelled as an estimate rather
      // than passed off as the server's own number.
      var t = r.verified_at ? Date.parse(r.verified_at) : NaN;
      r.__mins = isNaN(t) ? null : Math.round((Date.now() - t) / 60000);
      r.__minsFromServer = false;
    }
    return r;
  });
  rows.sort(function(a, b){ return (b.__mins == null ? -1 : b.__mins) - (a.__mins == null ? -1 : a.__mins); });

  var legend = side.legend || {};
  var legendHtml = '';
  Object.keys(legend).forEach(function(k){
    legendHtml += '<div class="s" style="margin-top:4px"><code>' + esc(k) + '</code> &mdash; ' + esc(legend[k]) + '</div>';
  });

  // ---- ⭐ the list that can cost a real player real money -------------------
  var body;
  if (unfulfilledProbeFailed) {
    body = '<p class="err"><strong>Could not read the outstanding list.</strong> '
         + 'This is NOT the same as "nothing outstanding" &mdash; the query failed. See Probe errors below.</p>';
  } else if (!rows.length) {
    body = '<p><strong>Nothing outstanding.</strong> Every settled purchase on record is marked '
         + '<code>fulfilled</code> &mdash; no player is waiting on goods they paid for. '
         + '<span class="chip">list read OK ' + when(d.generated_at) + '</span></p>';
  } else {
    body = '<p><strong>' + rows.length + ' settled purchase' + (rows.length === 1 ? '' : 's')
         + ' with NO confirmed grant.</strong> The money moved; the goods are not recorded as delivered. '
         + 'Oldest first &mdash; the top row is the most likely to be a player actually owed something.</p>'
         + table([
             { label:'Waiting', num:true, get:function(r){
                 if (r.__mins == null) return '<span class="none">no verified_at</span>';
                 return '<strong>' + age(r.__mins) + '</strong>'
                      + (r.__minsFromServer ? '' : ' <span class="chip">browser estimate</span>');
               } },
             { label:'Status', get:function(r){ return '<code>' + esc(r.status) + '</code>'
                 + (r.status === 'verified' ? ' <span class="chip warn">paid, grant unconfirmed</span>' : '')
                 + (r.status === 'manual_review' ? ' <span class="chip warn">needs a human</span>' : ''); } },
             { label:'SKU',     get:function(r){ return '<code>' + esc(r.sku) + '</code>'; } },
             { label:'Value',   num:true, get:function(r){ return usd(r.usd_anchor); } },
             { label:'Wallet',  get:function(r){ return '<code>' + esc(r.wallet_masked) + '</code>'; } },
             { label:'Network', get:function(r){ return esc(r.network || '—') + ' <span class="chip">' + esc(r.currency || '—') + '</span>'; } },
             { label:'Verified', get:function(r){ return when(r.verified_at); } },
             { label:'Chain transaction', get:function(r){ return '<code>' + esc(r.tx_signature) + '</code>'; } }
           ], rows)
         + (legendHtml ? '<div style="margin-top:10px">' + legendHtml + '</div>' : '');
  }
  if (sideErr) {
    body += '<p class="note">The <code>unfulfilled_minutes</code> column comes from '
          + '<code>/api/admin/db?view=purchases</code>, which did not answer (' + esc(sideErr)
          + '). Ages shown above are computed in the browser from <code>verified_at</code>.</p>';
  }
  var h = card('Paid, grant not confirmed', body,
      (na.note || '') + ' This screen is READ-ONLY: re-granting is a write and does not live on an '
      + 'admin viewer. The chain transaction is shown in full because it is already a public record '
      + 'and it is the exact string needed to confirm settlement.');

  // ---- the two probes that should always read 0 ---------------------------
  var dis = d.disagreement || {};
  var orphans = dis.client_events_without_entitlement || [];
  var mism = side.amount_mismatches;
  h += card('Should be zero',
    '<div class="tiles">'
    + tile('Amount mismatches',
        mism == null ? '<span class="none">unavailable</span>' : fmt(mism),
        mism == null
          ? 'the db endpoint did not answer'
          : (n(mism) ? '<span class="chip warn">investigate</span> expected &ne; observed on a settled row'
                     : 'expected = observed on every row, as it must be'))
    + tile('Client said paid, server has no row', fmt(orphans.length),
        orphans.length ? '<span class="chip warn">investigate</span> a grant may have gone out with no settlement behind it'
                       : 'every client purchase has a verified entitlement')
    + tile('Settled with no client event', fmt(dis.settled_without_client_event),
        'far less alarming — the client may simply not have reported, or it came in via reconcile')
    + '</div>'
    + (orphans.length ? table([
        { label:'Chain transaction', get:function(r){ return r.tx_signature ? '<code>' + esc(r.tx_signature) + '</code>' : '<span class="none">no txSig sent</span>'; } },
        { label:'Pack',    get:function(r){ return '<code>' + esc(r.pack_id) + '</code>'; } },
        { label:'Player',  get:function(r){ return '<code>' + esc(r.player_masked) + '</code>'; } },
        { label:'Events',  num:true, get:function(r){ return fmt(r.events); } },
        { label:'Last',    get:function(r){ return when(r.latest); } }
      ], orphans) : ''),
    (dis.note || '') + ' A non-zero figure in either of the first two tiles is an alert, not a statistic.');

  // ---- ⭐ quote → settle funnel -------------------------------------------
  var qf = d.quote_funnel || {};
  h += card('Quote → settle',
    '<div class="tiles">'
    + tile('Quotes issued', fmt(qf.issued), fmt(qf.wallets_quoted) + ' wallets opened the wallet prompt')
    + tile('Payments verified', fmt(qf.consumed), fmt(qf.wallets_that_paid) + ' wallets paid')
    + tile('Completed', qf.consumed_pct != null ? qf.consumed_pct + '%' : '<span class="none">no data yet</span>',
        'of quotes issued' + (qf.low_n ? ' &middot; <span class="chip warn">low n</span>' : ''))
    + tile('Expired unused', fmt(qf.expired_unconsumed), 'quote issued, payment never verified — 5 minute TTL')
    + tile('Live right now', fmt(qf.live), 'in flight; last issued ' + when(qf.last_issued_at))
    + '</div>'
    + card('By SKU',
      table([
        { label:'SKU',      get:function(r){ return '<code>' + esc(r.sku) + '</code>'
            + (r.low_n ? ' <span class="chip warn">low n</span>' : ''); } },
        { label:'Network',  get:function(r){ return esc(r.network || '—'); } },
        { label:'Issued',   num:true, get:function(r){ return fmt(r.issued); } },
        { label:'Verified', num:true, get:function(r){ return fmt(r.consumed); } },
        { label:'Completed', get:function(r){ return pctCell(r.consumed_pct, r.issued, r.low_n, true); } },
        { label:'Expired',  num:true, get:function(r){ return fmt(r.expired_unconsumed); } },
        { label:'Live',     num:true, get:function(r){ return fmt(r.live); } }
      ], qf.by_sku))
    + card('By day',
      table([
        { label:'Day',      get:function(r){ return esc(r.day); } },
        { label:'Issued',   num:true, get:function(r){ return fmt(r.issued); } },
        { label:'Verified', num:true, get:function(r){ return fmt(r.consumed); } },
        { label:'Completed', get:function(r){ return pctCell(r.consumed_pct, r.issued, r.low_n, true); } },
        { label:'Expired',  num:true, get:function(r){ return fmt(r.expired_unconsumed); } }
      ], qf.per_day)),
    qf.definition || '');

  // ---- settled money ------------------------------------------------------
  var s = d.settled || {};
  h += card('Settled on chain',
    '<div class="tiles">'
    + tile('Revenue, all time', usd(s.all_time_usd_anchor), fmt(s.all_time) + ' purchases &middot; ' + fmt(s.all_time_buyers) + ' buyers')
    + tile('Revenue, window',   usd(s.window_usd_anchor),   fmt(s.window) + ' purchases &middot; ' + fmt(s.window_buyers) + ' buyers')
    + tile('First settlement',  when(s.first_settled_at), 'latest ' + when(s.last_settled_at))
    + tile('Rows with no price', fmt(s.rows_without_usd_anchor),
        n(s.rows_without_usd_anchor) ? '<span class="chip warn">total understates the row count</span>' : 'every settled row carries a price')
    + '</div>',
    d.revenue_note || '');

  h += card('By settlement status',
    table([
      { label:'Status',  get:function(r){ return '<code>' + esc(r.status) + '</code>'
          + (r.status === 'verified' ? ' <span class="chip warn">paid, grant unconfirmed</span>' : '')
          + (r.status === 'manual_review' ? ' <span class="chip warn">needs a human</span>' : ''); } },
      { label:'Rows',    num:true, get:function(r){ return fmt(r.rows); } },
      { label:'Wallets', num:true, get:function(r){ return fmt(r.wallets); } },
      { label:'Value',   num:true, get:function(r){ return usd(r.usd_anchor_total); } },
      { label:'Latest',  get:function(r){ return when(r.latest); } }
    ], d.by_status),
    'The same counts the summary tiles come from, split by the state machine the rail actually writes.');

  h += card('By SKU',
    table([
      { label:'SKU',       get:function(r){ return '<code>' + esc(r.sku) + '</code>'; } },
      { label:'Currency',  get:function(r){ return esc(r.currency || '—') + ' <span class="chip">' + esc(r.network || '—') + '</span>'; } },
      { label:'Settled',   num:true, get:function(r){ return fmt(r.settled); } },
      { label:'Buyers',    num:true, get:function(r){ return fmt(r.buyers); } },
      { label:'Fulfilled', num:true, get:function(r){ return fmt(r.fulfilled); } },
      { label:'Awaiting grant', num:true, get:function(r){
          if (!n(r.awaiting_fulfilment)) return '<span class="muted">0</span>';
          return '<strong>' + fmt(r.awaiting_fulfilment) + '</strong> <span class="chip warn">unconfirmed</span>'; } },
      { label:'Manual review', num:true, get:function(r){
          if (!n(r.manual_review)) return '<span class="muted">0</span>';
          return '<strong>' + fmt(r.manual_review) + '</strong>'; } },
      { label:'Value',     num:true, get:function(r){ return usd(r.usd_anchor_total)
          + (n(r.rows_without_usd_anchor) ? ' <span class="chip warn">' + fmt(r.rows_without_usd_anchor) + ' unpriced</span>' : ''); } },
      { label:'Base units observed', num:true, get:function(r){ return fmt(r.base_units_observed); } },
      { label:'Latest',    get:function(r){ return when(r.last_settled_at); } }
    ], d.by_sku),
    'Base units are raw integers — their decimals live on the quote (6 on mainnet, 9 on devnet), so they are deliberately not converted to a token amount.');

  var maxUsd = 0; (d.per_day || []).forEach(function(r){ maxUsd = Math.max(maxUsd, n(r.usd_anchor_total)); });
  h += card('Settlements per day',
    table([
      { label:'Day',      get:function(r){ return esc(r.day); } },
      { label:'Settled',  num:true, get:function(r){ return fmt(r.settled); } },
      { label:'Buyers',   num:true, get:function(r){ return fmt(r.buyers); } },
      { label:'Value',    num:true, get:function(r){ return usd(r.usd_anchor_total); } },
      { label:'',         get:function(r){ return bar(r.usd_anchor_total, maxUsd); } }
    ], d.per_day));

  h += card('Recent settlements',
    table([
      { label:'When',   get:function(r){ return when(r.created_at); } },
      { label:'Status', get:function(r){ return '<code>' + esc(r.status) + '</code>'
          + (r.fulfilled_at ? '' : ' <span class="chip warn">no grant recorded</span>'); } },
      { label:'SKU',    get:function(r){ return '<code>' + esc(r.sku) + '</code>'; } },
      { label:'Value',  num:true, get:function(r){ return usd(r.usd_anchor); } },
      { label:'Wallet', get:function(r){ return '<code>' + esc(r.wallet_masked) + '</code>'; } },
      { label:'Expected', num:true, get:function(r){ return fmt(r.expected_lamports); } },
      { label:'Observed', num:true, get:function(r){ return fmt(r.observed_lamports)
          + (String(r.expected_lamports) !== String(r.observed_lamports) ? ' <span class="chip warn">mismatch</span>' : ''); } },
      { label:'Grant confirmed', get:function(r){ return r.fulfilled_at ? when(r.fulfilled_at) : '<span class="none">not yet</span>'; } },
      { label:'Chain transaction', get:function(r){ return '<code>' + esc(r.tx_signature) + '</code>'; } }
    ], d.recent_settlements),
    'Wallets masked to first four and last four characters, as everywhere else. The transaction signature is a public chain record and is shown whole.');

  if (probeErrs.length || sideErr) {
    h += card('Probe errors',
      table([
        { label:'Probe', get:function(r){ return '<code>' + esc(r.probe) + '</code>'; } },
        { label:'Error', get:function(r){ return esc(r.error); } }
      ], probeErrs.concat(sideErr ? [{ probe:'api/admin/db?view=purchases', error:sideErr }] : [])),
      'Each money table is queried independently, so schema drift degrades one section instead of blanking the page. A probe listed here means the section above it is INCOMPLETE, not empty.');
  }
  return h;
}

// ── Player reports (TROUBLESHOOT) ────────────────────────────
// The ONLY view on this page sourced from /api/admin/db instead of
// /api/admin/stats — there is no aggregate behind a bug report, the rows ARE
// the artifact. Response shape: { view:'bugreports', rows:[ report_id,
// created_at, description, route, app_version, player_id, platform, session_id,
// trace_tail, has_screenshot ] } (api/admin/db.js, view=bugreports).
//
// ⚠ EMPTY IS NOT THE SAME AS HEALTHY. bug_reports held ZERO rows all-time
// because every INSERT was failing (WO-1169 §4) — so "no rows" gets a sentence
// that says the write path is the first thing to check, not a blank table that
// reads as "no one has reported anything".
//
// ⛔ DISPLAY ONLY. No delete, no resolve, no reply. api/admin/db.js is
// read-only BY CONSTRUCTION and a button here would be the reason that stops
// being true. The screenshot and the full trace tail are deliberately NOT
// fetched: they need ?view=bugreport&id=<n>[&shot=1], one report at a time.
function renderBugReports(d){
  var rows = d.rows || [];
  var body;
  if (!rows.length) {
    body = '<p><strong>No player reports stored.</strong> '
         + 'Read this as a claim about the TABLE, not about the players: this table held zero rows '
         + 'all-time while every insert was failing. If testers have submitted reports, check the '
         + 'write path (<code>api/bug-report.js</code>) and the runtime log before concluding the '
         + 'queue is clear.</p>';
  } else {
    body = table([
      { label:'When',    get:function(r){ return when(r.created_at); } },
      { label:'Route',   get:function(r){ return r.route ? '<code>' + esc(r.route) + '</code>' : '<span class="none">unknown</span>'; } },
      { label:'Version', get:function(r){ return r.app_version ? esc(r.app_version) : '<span class="none">unknown</span>'; } },
      { label:'Report',  get:function(r){
          var t = String(r.description == null ? '' : r.description);
          var shown = t.length > 600 ? t.slice(0, 600) + '…' : t;
          var h = shown.trim()
                ? esc(shown).split(String.fromCharCode(10)).join('<br>')
                : '<span class="none">no note — the capture is the report</span>';
          if (r.platform)       h += ' <span class="chip">' + esc(r.platform) + '</span>';
          if (r.has_screenshot) h += ' <span class="chip">screenshot</span>';
          var tail = Array.isArray(r.trace_tail) ? r.trace_tail.length : 0;
          if (tail)             h += ' <span class="chip">' + tail + ' trace lines</span>';
          return h;
        }, cell:'wrapcell' },
      { label:'Id', num:true, get:function(r){ return '<code>' + esc(r.report_id == null ? '—' : r.report_id) + '</code>'; } }
    ], rows);
  }
  return card('Player bug reports', body,
    'Newest first, from the in-game report form. Read-only — there is no resolve, delete or reply '
    + 'here on purpose. The screenshot and the full trace tail are not loaded in this list; fetch one '
    + 'report with /api/admin/db?view=bugreport&id=<report_id>&shot=1.');
}

// ── shell ──────────────────────────────────────────────────────────────────
function paintTabs(){
  el('tabs').innerHTML = VIEWS.map(function(v){
    return '<button data-view="' + v[0] + '" aria-pressed="' + (v[0] === view) + '">' + esc(v[1]) + '</button>';
  }).join('');
}

function load(extra){
  var out = el('out');
  out.innerHTML = '<section class="card"><p class="muted">Loading ' + esc(view) + '…</p></section>';
  var params = 'view=' + encodeURIComponent(view) + '&days=' + encodeURIComponent(days) + (extra || '');

  // Player reports come from api/admin/db (the rows ARE the artifact; there is
  // no aggregate behind them), so this view does NOT call api/admin/stats at
  // all. `days` is not a parameter there — the list is newest-first and bounded
  // by limit, and pretending the window filtered it would be a lie on screen.
  if (view === 'bugreports') {
    var reports = apiGet('/api/admin/db', 'view=bugreports&limit=50');
    reports.then(function(d){
      out.innerHTML = renderBugReports(d)
        + '<p class="muted" style="font-size:12px;padding:0 2px 24px">Newest 50 &middot; '
        + 'not filtered by the time window &middot; read-only.</p>';
    }).catch(function(e){
      out.innerHTML = '<section class="card err"><h2>Could not load player reports</h2>'
        + '<p>' + esc(e.message || e) + '</p>'
        + '<p class="note">This is NOT the same as "no reports". A wrong key and an unknown view both '
        + 'answer 400 here; a 500 means the read query itself failed against the table.</p></section>';
    });
    return;
  }

  var main = api(params);
  var pending = main;

  if (view === 'purchases') {
    // The Money view also reads api/admin/db, which is where the SERVER-computed
    // unfulfilled_minutes lives. A failure there must degrade one column and one
    // tile — never blank the page — so its rejection is folded into a value.
    var side = apiGet('/api/admin/db', 'view=purchases&state=unfulfilled&limit=100')
      .catch(function(e){ return { __error: String((e && e.message) || e) }; });
    pending = Promise.all([main, side]).then(function(r){ r[0].__side = r[1]; return r[0]; });
  }

  pending.then(function(d){
    var html;
    if (view === 'overview')        html = renderOverview(d);
    else if (view === 'retention')  html = renderRetention(d);
    else if (view === 'funnel')     html = renderFunnel(d);
    else if (view === 'purchases')  html = renderPurchases(d, d.__side);
    else if (view === 'economy')    html = renderEconomy(d);
    else                            html = renderPlayers(d);
    out.innerHTML = html
      + '<p class="muted" style="font-size:12px;padding:0 2px 24px">Generated ' + when(d.generated_at)
      + ' &middot; window ' + esc(d.window_days) + ' days &middot; read-only.</p>';
  }).catch(function(e){
    out.innerHTML = '<section class="card err"><h2>Could not load</h2><p>' + esc(e.message || e) + '</p>'
      + '<p class="note">A wrong key and an unknown view both answer 400 here. If it says Unauthorized, '
      + 'press Lock and enter the key again.</p></section>';
  });
}

el('enter').addEventListener('click', function(){
  var k = el('key').value.trim();
  var b = el('base').value.trim();
  if (!k) { el('gateMsg').textContent = 'Enter the admin key.'; return; }
  if (!/^https?:\/\//i.test(b)) { el('gateMsg').textContent = 'API host must start with https://'; return; }
  adminKey = k; apiBase = b;
  el('key').value = '';                 // clear the field; the value lives only in the closure
  el('gate').hidden = true;
  el('app').hidden = false;
  paintTabs();
  load();
});
el('key').addEventListener('keydown', function(e){ if (e.key === 'Enter') el('enter').click(); });

el('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button[data-view]');
  if (!b) return;
  view = b.getAttribute('data-view');
  paintTabs();
  load();
});
el('days').addEventListener('change', function(e){ days = parseInt(e.target.value, 10) || 30; load(); });
el('refresh').addEventListener('click', function(){ load(); });
el('lock').addEventListener('click', function(){
  adminKey = null;                      // the only copy — gone
  el('out').innerHTML = '';
  el('app').hidden = true;
  el('gate').hidden = false;
  el('gateMsg').textContent = 'Locked.';
});
el('out').addEventListener('click', function(e){
  var back = e.target.closest('#backPlayers');
  if (back) { load(); return; }
  var row = e.target.closest('tr.click');
  if (row && view === 'players') load('&ref=' + encodeURIComponent(row.getAttribute('data-ref')));
});
})();
</script>
</body>
</html>
